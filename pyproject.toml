[project]
name = "free-grab-node"
version = "1.0.0"
description = "Free node subscription generator and validator"
readme = "README.md"
requires-python = ">=3.9"

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true